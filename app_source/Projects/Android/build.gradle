apply plugin: 'com.android.application'
apply from: "${rootProject.projectDir}/ovr_sdk/VrApp.gradle"

android {
  namespace "com.rail.oculus.teleop"
  ndkVersion "21.4.7075529"
  buildToolsVersion "36.1.0"

  // This is the name of the generated apk file, which will have
  // -debug.apk or -release.apk appended to it.
  // The filename doesn't effect the Android installation process.
  // Use only letters to remain compatible with the package name.
  project.archivesBaseName = "teleop"

  defaultConfig {
    // Gradle replaces the manifest package with this value, which must
    // be unique on a system.  If you don't change it, a new app
    // will replace an older one.
    applicationId "com.rail.oculus." + project.archivesBaseName
    minSdkVersion 24
    targetSdkVersion 25

    // override app plugin abiFilters for 64-bit support
    externalNativeBuild {
        ndk {
                abiFilters 'arm64-v8a'
        }
        ndkBuild {
                abiFilters 'arm64-v8a'
        }
    }
  }

  sourceSets {
    main {
      manifest.srcFile 'AndroidManifest.xml'
      java.srcDirs = ['../../java']
      res.srcDirs = ['../../res']
      assets.srcDirs = ['../../assets']
    }
  }

  lintOptions {
    disable 'ExpiredTargetSdkVersion'
  }
}

tasks.withType(Exec) {
    if (it.commandLine.contains('python')) {
        it.commandLine = ['/usr/local/bin/python', *it.commandLine.drop(1)]
    }
}
